      - name: Build APK
        shell: bash
        run: |
          GRADLEW=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside ZIP"
            find extracted -maxdepth 5 -print
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon
