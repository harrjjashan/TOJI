name: Build TOJI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project ZIP
        uses: actions/checkout@v4

      - name: Extract TOJI project
        run: |
          unzip -q TOJI_AndroidIDE_V2.zip -d extracted
          echo "Extracted:"
          find extracted -maxdepth 2 -type f | head -30

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOJI-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
